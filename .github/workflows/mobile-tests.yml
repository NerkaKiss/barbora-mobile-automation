name: BARBORA Mobile Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BARBORA_LOGIN_EMAIL: ${{ secrets.BARBORA_LOGIN_EMAIL }}
      BARBORA_LOGIN_PASSWORD: ${{ secrets.BARBORA_LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Download BARBORA APK
        env:
          GH_TOKEN: ${{ secrets.BARBORA_APK_TOKEN }}
        run: |
          gh release download v1 \
            --repo NerkaKiss/barbora-test-apk \
            --pattern "barbora-apk.zip"

          mkdir -p apk
          unzip barbora-apk.zip -d apk

          echo "Downloaded APK files:"
          ls -lh apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run BARBORA mobile tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true

          emulator-options: >-
            -no-snapshot-load
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none

          script: |
            echo "Connected devices:"
            adb devices

            echo "Installing BARBORA..."
            adb -s emulator-5554 install-multiple -r apk/*.apk

            echo "Granting notification permission..."
            adb -s emulator-5554 shell pm grant lt.barbora android.permission.POST_NOTIFICATIONS

            echo "Installed BARBORA package:"
            adb -s emulator-5554 shell dumpsys package lt.barbora | grep -E "versionName|versionCode" || true

            echo "Starting Appium..."
            appium --log appium.log --log-level info &

            echo "Waiting for Appium..."
            ATTEMPT=0
            until curl -fsS http://127.0.0.1:4723/status > /dev/null; do
              ATTEMPT=$((ATTEMPT + 1))

              if [ "$ATTEMPT" -ge 30 ]; then
                echo "Appium failed to start"
                exit 1
              fi

              sleep 2
            done

            echo "Appium is ready."

            echo "Running tests..."
            mvn -B clean test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: barbora-mobile-test-artifacts-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/allure-results/
            target/surefire-reports/
            screenshots/
            videos/
            appium.log