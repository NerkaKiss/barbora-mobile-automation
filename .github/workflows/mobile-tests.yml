name: BARBORA Mobile Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - full

  schedule:
    - cron: '37 0 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      pages-ready: ${{ steps.pages-ready.outputs.ready }}

    env:
      BARBORA_LOGIN_EMAIL: ${{ secrets.BARBORA_LOGIN_EMAIL }}
      BARBORA_LOGIN_PASSWORD: ${{ secrets.BARBORA_LOGIN_PASSWORD }}
      TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'full' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Appium
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Download BARBORA APK
        env:
          GH_TOKEN: ${{ secrets.BARBORA_APK_TOKEN }}
        run: |
          gh release download v1 \
            --repo NerkaKiss/barbora-test-apk \
            --pattern "barbora-apk.zip"

          mkdir -p apk
          unzip barbora-apk.zip -d apk

          echo "Downloaded APK files:"
          ls -lh apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium
        run: |
          nohup appium --log appium.log --log-level info > appium-console.log 2>&1 &
          echo $! > appium.pid

          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:4723/status >/dev/null; do sleep 2; done'

          echo "Appium is ready"
          curl -fsS http://127.0.0.1:4723/status

      - name: Run BARBORA mobile tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true
          disable-spellchecker: true

          emulator-options: >-
            -no-snapshot-load
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
            -camera-back none
            -camera-front none

          script: |
            echo "Connected devices:"
            adb devices

            echo "Disabling Android crash and ANR dialogs..."
            adb -s emulator-5554 shell settings put global hide_error_dialogs 1
            adb -s emulator-5554 shell settings put global show_first_crash_dialog 0

            echo "Installing BARBORA..."
            adb -s emulator-5554 install-multiple -r apk/*.apk

            echo "Granting notification permission..."
            adb -s emulator-5554 shell pm grant lt.barbora android.permission.POST_NOTIFICATIONS

            echo "Installed BARBORA package:"
            adb -s emulator-5554 shell dumpsys package lt.barbora | grep -E "versionName|versionCode" || true

            echo "Running $TEST_SUITE tests..."
            if [ "$TEST_SUITE" = "full" ]; then mvn -B clean test; else mvn -B clean test -Dgroups="$TEST_SUITE"; fi

      - name: Stop Appium
        if: always()
        run: |
          if [ -f appium.pid ]; then
            kill "$(cat appium.pid)" || true
          fi

      # ------------------------------------------------------------
      # Allure / GitHub Pages
      # ------------------------------------------------------------

      - name: Check for Allure results
        if: always()
        id: allure-results
        shell: bash
        run: |
          if [ -d "target/allure-results" ] && find target/allure-results -type f -print -quit | grep -q .; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
            echo "Allure results found."
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No Allure results found."
          fi

      - name: Generate Allure report
        if: ${{ always() && env.TEST_SUITE == 'full' && steps.allure-results.outputs.has_results == 'true' }}
        run: mvn -B allure:report

      - name: Configure GitHub Pages
        if: ${{ always() && env.TEST_SUITE == 'full' && steps.allure-results.outputs.has_results == 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload Allure report to GitHub Pages
        if: ${{ always() && env.TEST_SUITE == 'full' && steps.allure-results.outputs.has_results == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

      - name: Mark Pages artifact ready
        if: ${{ always() && env.TEST_SUITE == 'full' && steps.allure-results.outputs.has_results == 'true' }}
        id: pages-ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Test artifacts
      # ------------------------------------------------------------

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: barbora-mobile-test-artifacts-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/allure-results/
            target/surefire-reports/
            screenshots/
            page-sources/
            videos/
            appium.log
            appium-console.log

  deploy-pages:
    name: Deploy Allure report
    needs: mobile-tests

    if: ${{ always() && needs.mobile-tests.outputs.pages-ready == 'true' }}

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5